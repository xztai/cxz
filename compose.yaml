name: etheyl

x-backend: &backend
  image: etheyl-backend:stage1
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgres://etheyl_api:${API_DATABASE_PASSWORD:?Run make init}@postgres:5432/etheyl?sslmode=disable
    YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
    YOOKASSA_API_KEY: ${YOOKASSA_API_KEY:-}
    OUTBOX_KEYS: ${OUTBOX_KEYS:?Run make init}
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    TRUST_PROXY: 'true'
    S3_ENDPOINT: rustfs:9000
    S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-etheyl}
    S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Run make init}
    S3_BUCKET: ${S3_BUCKET:-etheyl-media}
    S3_SECURE: 'false'
    SMTP_HOST: mailpit
    SMTP_PORT: '1025'
    SMTP_FROM: 'etheyl <noreply@etheyl.local>'
    SMTP_INSECURE: 'true'
  networks: [app, data]
  init: true
  restart: unless-stopped
  healthcheck:
    test: [CMD, etheyl, healthcheck]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

services:
  proxy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    ports: ['127.0.0.1:${APP_PORT:-8080}:80']
    volumes: ['./infra/Caddyfile:/etc/caddy/Caddyfile:ro']
    networks: [app]
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/api/v1/health]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    image: etheyl-frontend:stage1
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8081
    networks: [app]
    init: true
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    <<: *backend
    command: [api]
    depends_on:
      db-grants: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
  worker:
    <<: *backend
    command: [worker]
    environment:
      <<: *backend-env
      DATABASE_URL: postgres://etheyl_worker:${WORKER_DATABASE_PASSWORD:?Run make init}@postgres:5432/etheyl?sslmode=disable
    depends_on:
      db-grants: {condition: service_completed_successfully}
      mailpit: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
  migrate:
    <<: *backend
    command: [migrate]
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgres://etheyl_migrator:${MIGRATE_DATABASE_PASSWORD:?Run make init}@postgres:5432/etheyl?sslmode=disable
    restart: 'no'
    healthcheck: {disable: true}
    depends_on:
      db-roles: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
  db-roles: &db-roles
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    entrypoint: [sh, /db-roles.sh]
    environment: &roles-env
      PGHOST: postgres
      POSTGRES_USER: etheyl
      POSTGRES_DB: etheyl
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run make init}
      ROLE_PHASE: bootstrap
      MIGRATE_DATABASE_PASSWORD: ${MIGRATE_DATABASE_PASSWORD:?Run make init}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Run make init}
      WORKER_DATABASE_PASSWORD: ${WORKER_DATABASE_PASSWORD:?Run make init}
    volumes: ['./infra/db-roles.sh:/db-roles.sh:ro']
    networks: [data]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
  db-grants:
    <<: *db-roles
    environment:
      <<: *roles-env
      ROLE_PHASE: grants
    depends_on:
      migrate: {condition: service_completed_successfully}
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: etheyl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init}
      POSTGRES_DB: etheyl
      TZ: UTC
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U etheyl -d etheyl']
      interval: 5s
      timeout: 5s
      retries: 20
  storage-init:
    <<: *backend
    command: [storage-init]
    restart: 'no'
    healthcheck: {disable: true}
    depends_on:
      db-grants: {condition: service_completed_successfully}
      rustfs: {condition: service_healthy}
  rustfs:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-etheyl}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Run make init}
      RUSTFS_CONSOLE_ENABLE: 'false'
    volumes: [rustfs_data:/data]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/health/ready]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports: ['127.0.0.1:${MAILPIT_PORT:-8025}:8025']
    networks: [app]
    restart: unless-stopped
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  app:
  data:
    internal: true
volumes:
  postgres_data:
  rustfs_data:
