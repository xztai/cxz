openapi: 3.1.0
info:
  title: etheyl API
  version: 1.0.0
  description: |
    Профили авторов, уровни подписки, публикации и приватные медиа. Все ответы приватные (Cache-Control no-store).
    Для браузерных POST, PUT и DELETE нужны точный Origin, HttpOnly CSRF-cookie и заголовок X-CSRF-Token,
    полученные через GET /auth/csrf. В HTTPS имена cookies имеют префикс __Host-.
    Сессия живёт 30 дней; подтверждение email — 24 часа; сброс пароля — 1 час.
    Все auth POST: 60 запросов/IP/15 минут; регистрация 5/IP;
    вход 10/email; письма 3/email/тип. Ответ 429 содержит Retry-After: 900.
    Смена неподтверждённого email — 5 попыток/IP/15 минут, с проверкой текущего пароля и лимитами входа.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': { $ref: '#/components/responses/Status' }
        default: { $ref: '#/components/responses/Error' }
  /auth/csrf:
    get:
      operationId: csrf
      responses:
        '200':
          description: CSRF token and HttpOnly cookie
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: me
      responses:
        '200':
          description: Current user or null for an anonymous/expired/revoked session
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    oneOf:
                      - { $ref: '#/components/schemas/User' }
                      - { type: 'null' }
        default: { $ref: '#/components/responses/Error' }
  /admin/status:
    get:
      operationId: adminStatus
      security: [{session: []}]
      responses:
        '200': { $ref: '#/components/responses/Status' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/register:
    post:
      operationId: register
      security: [{csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Register' }
      responses:
        '202': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      description: Correct credentials for an unverified email return 403 email_unverified without creating a session.
      security: [{csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Session cookie and user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      security: [{csrf: []}]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        default: { $ref: '#/components/responses/Error' }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      security: [{csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Token' }
      responses:
        '200':
          description: Email verified and session created atomically; sets HttpOnly session cookie
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }
  /auth/verify-email/preview:
    post:
      operationId: previewVerification
      description: Returns the email for a valid verification token without consuming it or signing in.
      security: [{csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Token' }
      responses:
        '200':
          description: Email address to display before confirmation
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: { type: string, format: email }
        default: { $ref: '#/components/responses/Error' }
  /auth/resend-verification:
    post:
      operationId: resendVerification
      security: [{csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Email' }
      responses:
        '202': { $ref: '#/components/responses/Message' }
        default: { $ref: '#/components/responses/Error' }
  /auth/change-unverified-email:
    post:
      operationId: changeUnverifiedEmail
      description: Checks the current email and password under a user row lock. Only unverified, unblocked accounts can change address. Updates the email and queues a fresh verification link atomically, invalidating the previous link. Does not create a session. Limited to 5 attempts/IP/15 minutes and the shared failed-login limits.
      security: [{csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, newEmail, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                newEmail: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '202': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: email_exists or email_already_verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      security: [{csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Email' }
      responses:
        '202': { $ref: '#/components/responses/Message' }
        default: { $ref: '#/components/responses/Error' }
  /auth/reset-password:
    post:
      operationId: resetPassword
      description: Revokes all sessions and clears failed-login limits for the requesting IP/email pair and account risk on success. Rejects the current password with 422 password_unchanged; the action token, existing sessions and failed-login limits remain valid for a corrected submission.
      security: [{csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
                password: { $ref: '#/components/schemas/Password' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /me/profile:
    get:
      operationId: ownProfile
      security: [{session: []}]
      responses:
        '200':
          description: Own profile; null until first save
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    oneOf:
                      - {$ref: '#/components/schemas/Profile'}
                      - {type: 'null'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: saveProfile
      description: Creates public profile and atomically updates the account nickname. Owner comes from the session.
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileInput'}
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        default: {$ref: '#/components/responses/Error'}
  /me/profile/images/{kind}:
    parameters:
      - {name: kind, in: path, required: true, schema: {type: string, enum: [avatar, cover]}}
    put:
      operationId: uploadProfileImage
      description: Raw image bytes, at most 5 MiB and 16 million pixels, each side at most 8192. Actual type must match Content-Type. Re-encoded before storage.
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: removeProfileImage
      security: [{session: [], csrf: []}]
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        default: {$ref: '#/components/responses/Error'}
  /authors:
    get:
      operationId: listAuthors
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
      responses:
        '200':
          description: Up to 24 public authors; literal case-insensitive search across nickname, name and description
          content:
            application/json:
              schema:
                type: object
                required: [authors, hasMore]
                properties:
                  authors: {type: array, items: {$ref: '#/components/schemas/Profile'}}
                  hasMore: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
  /authors/{nickname}:
    get:
      operationId: publicAuthor
      parameters:
        - {name: nickname, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Public profile and active tiers ordered highest first; no email or storage keys
          content:
            application/json:
              schema:
                type: object
                required: [profile, tiers]
                properties:
                  profile: {$ref: '#/components/schemas/Profile'}
                  tiers: {type: array, items: {$ref: '#/components/schemas/Tier'}}
        default: {$ref: '#/components/responses/Error'}
  /authors/{nickname}/images/{kind}:
    get:
      operationId: publicProfileImage
      parameters:
        - {name: nickname, in: path, required: true, schema: {type: string}}
        - {name: kind, in: path, required: true, schema: {type: string, enum: [avatar, cover]}}
      responses:
        '200':
          description: Validated image streamed from private storage
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
        default: {$ref: '#/components/responses/Error'}
  /me/tiers:
    get:
      operationId: ownTiers
      security: [{session: []}]
      responses:
        '200': {$ref: '#/components/responses/Tiers'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createTier
      description: New tier is always placed above all existing tiers, including archived tiers. Maximum 50 active tiers.
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TierInput'}
      responses:
        '201': {$ref: '#/components/responses/Tier'}
        default: {$ref: '#/components/responses/Error'}
  /me/tiers/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    put:
      operationId: updateTier
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TierInput'}
      responses:
        '200': {$ref: '#/components/responses/Tier'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteTier
      description: Unused tiers are deleted; used tiers are archived and retain their position and access hierarchy.
      security: [{session: [], csrf: []}]
      responses:
        '200': {$ref: '#/components/responses/Message'}
        default: {$ref: '#/components/responses/Error'}
  /me/tiers/{id}/archive:
    post:
      operationId: archiveTier
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      security: [{session: [], csrf: []}]
      responses:
        '200': {$ref: '#/components/responses/Message'}
        default: {$ref: '#/components/responses/Error'}
  /me/tiers/order:
    put:
      operationId: reorderTiers
      description: Complete list of active IDs, highest first. Positions of used tiers are immutable; archived positions are reserved.
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids: {type: array, maxItems: 50, items: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Tiers'}
        default: {$ref: '#/components/responses/Error'}
  /me/posts:
    get:
      operationId: ownPosts
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/PostOffset'}]
      responses:
        '200': {$ref: '#/components/responses/Posts'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createPost
      security: [{session: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/Post'}
      responses:
        '201': {$ref: '#/components/responses/Post'}
        default: {$ref: '#/components/responses/Error'}
  /me/posts/{id}:
    parameters: [{$ref: '#/components/parameters/PostID'}]
    get:
      operationId: ownPost
      security: [{session: []}]
      responses:
        '200': {$ref: '#/components/responses/Post'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updatePost
      security: [{session: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/Post'}
      responses:
        '200': {$ref: '#/components/responses/Post'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deletePost
      security: [{session: [], csrf: []}]
      responses:
        '200': {$ref: '#/components/responses/Message'}
        default: {$ref: '#/components/responses/Error'}
  /me/posts/{id}/publish:
    parameters: [{$ref: '#/components/parameters/PostID'}]
    post:
      operationId: publishPost
      security: [{session: [], csrf: []}]
      responses:
        '200': {$ref: '#/components/responses/Post'}
        default: {$ref: '#/components/responses/Error'}
  /me/posts/{id}/unpublish:
    parameters: [{$ref: '#/components/parameters/PostID'}]
    post:
      operationId: unpublishPost
      security: [{session: [], csrf: []}]
      responses:
        '200': {$ref: '#/components/responses/Post'}
        default: {$ref: '#/components/responses/Error'}
  /me/posts/{id}/media:
    parameters: [{$ref: '#/components/parameters/PostID'}]
    post:
      operationId: uploadPostMedia
      description: |
        Raw file body, up to 104857600 bytes (100 MiB), through the API only.
        Original bytes are preserved. Images PNG/JPEG/GIF/WebP up to 8192px and 16MP
        receive a separate PNG thumbnail up to 640px. Audio/video are served as originals;
        browser codec support is required. SVG/HTML and arbitrary files use attachment kind.
        Failed uploads expire after one hour. No public S3 URLs are issued.
      security: [{session: [], csrf: []}]
      parameters:
        - {in: query, name: kind, required: true, schema: {type: string, enum: [image, audio, video, attachment]}}
        - {in: query, name: filename, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Ready file attached to the post
          content:
            application/json:
              schema:
                type: object
                required: [media]
                properties:
                  media: {$ref: '#/components/schemas/PostFile'}
        '413': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /me/posts/{id}/media/{mediaID}:
    parameters: [{$ref: '#/components/parameters/PostID'}, {$ref: '#/components/parameters/MediaID'}]
    delete:
      operationId: detachPostMedia
      security: [{session: [], csrf: []}]
      responses:
        '200': {$ref: '#/components/responses/Message'}
        default: {$ref: '#/components/responses/Error'}
  /authors/{nickname}/posts:
    get:
      operationId: authorPosts
      description: Published titles and explicit public teasers only; never contains body or media.
      parameters:
        - {in: path, name: nickname, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/PostOffset'}
      responses:
        '200': {$ref: '#/components/responses/Posts'}
        default: {$ref: '#/components/responses/Error'}
  /posts/{id}:
    parameters: [{$ref: '#/components/parameters/PostID'}]
    get:
      operationId: getPost
      description: |
        Drafts are visible only to their author. Published posts are public or require an
        active subscription of at least the minimum tier, for the same author. Tier order,
        not price, defines access. Archived tiers retain grants. A locked response omits
        bodyMarkdown, bodyHtml and media entirely; teaser is never derived from the body.
      responses:
        '200': {$ref: '#/components/responses/Post'}
        default: {$ref: '#/components/responses/Error'}
  /media/{mediaID}/{variant}:
    parameters:
      - {$ref: '#/components/parameters/MediaID'}
      - {in: path, name: variant, required: true, schema: {type: string, enum: [original, thumbnail]}}
      - {in: header, name: Range, schema: {type: string}, description: HTTP byte ranges, including suffix and multiple ranges}
      - {in: header, name: If-Range, schema: {type: string}}
    get:
      operationId: getPostMedia
      description: |
        Authorizes the parent post before serving bytes or conditional responses.
        Cache-Control no-store, Vary Cookie, no public URLs. Attachments always have
        Content-Disposition attachment and application/octet-stream. No ETag is issued.
      responses:
        '200': {$ref: '#/components/responses/MediaBytes'}
        '206': {$ref: '#/components/responses/MediaBytes'}
        '403': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '416': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    head:
      operationId: headPostMedia
      description: Same authorization and headers as GET, without body.
      responses:
        '200': {$ref: '#/components/responses/MediaBytes'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /billing/checkout:
    {
      "post":
        {
          "operationId": "checkout",
          "security": [{ "session": [], "csrf": [] }],
          "responses":
            {
              "default": { "$ref": "#/components/responses/Error" },
              "202": { "$ref": "#/components/responses/Payment" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["tierId", "priceKopecks", "autoRenew"],
                          "properties":
                            {
                              "tierId": { "type": "string" },
                              "priceKopecks":
                                {
                                  "type": "integer",
                                  "minimum": 100,
                                  "maximum": 100000000,
                                },
                              "autoRenew":
                                {
                                  "type": "boolean",
                                  "description": "Explicit consent; false by default in UI",
                                },
                            },
                        },
                    },
                },
            },
        },
    }
  /me/payments/{id}:
    {
      "parameters":
        [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": { "type": "string" },
          },
        ],
      "get":
        {
          "operationId": "payment",
          "security": [{ "session": [] }],
          "responses":
            {
              "200": { "$ref": "#/components/responses/Payment" },
              "default": { "$ref": "#/components/responses/Error" },
            },
        },
    }
  /me/payments:
    {
      "get":
        {
          "operationId": "payments",
          "security": [{ "session": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Test shop only; authoritative server verification",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["payments", "hasMore"],
                              "properties":
                                {
                                  "payments":
                                    {
                                      "type": "array",
                                      "items":
                                        {
                                          "$ref": "#/components/schemas/PaymentHistory",
                                        },
                                    },
                                  "hasMore": { "type": "boolean" },
                                },
                            },
                        },
                    },
                },
              "default": { "$ref": "#/components/responses/Error" },
            },
          "parameters":
            [
              {
                "name": "offset",
                "in": "query",
                "schema":
                  {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 100000,
                    "default": 0,
                  },
              },
            ],
        },
    }
  /me/subscriptions:
    {
      "get":
        {
          "operationId": "subscriptions",
          "security": [{ "session": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Test shop only; authoritative server verification",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required":
                                ["subscriptions", "hasMore", "paymentsEnabled"],
                              "properties":
                                {
                                  "subscriptions":
                                    {
                                      "type": "array",
                                      "items":
                                        {
                                          "$ref": "#/components/schemas/Subscription",
                                        },
                                    },
                                  "hasMore": { "type": "boolean" },
                                  "paymentsEnabled": { "type": "boolean" },
                                },
                            },
                        },
                    },
                },
              "default": { "$ref": "#/components/responses/Error" },
            },
          "parameters":
            [
              {
                "name": "offset",
                "in": "query",
                "schema":
                  {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 100000,
                    "default": 0,
                  },
              },
            ],
        },
    }
  /me/subscriptions/{id}/cancel:
    {
      "parameters":
        [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": { "type": "string" },
          },
        ],
      "post":
        {
          "operationId": "cancelSubscription",
          "security": [{ "session": [], "csrf": [] }],
          "responses":
            {
              "200": { "$ref": "#/components/responses/Message" },
              "default": { "$ref": "#/components/responses/Error" },
            },
        },
    }
  /me/subscriptions/{id}/tier:
    {
      "parameters":
        [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": { "type": "string" },
          },
        ],
      "put":
        {
          "operationId": "changeSubscriptionTier",
          "security": [{ "session": [], "csrf": [] }],
          "responses":
            {
              "200": { "$ref": "#/components/responses/Message" },
              "default": { "$ref": "#/components/responses/Error" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/BillingTierInput" },
                    },
                },
            },
        },
    }
  /billing/yookassa/webhook:
    {
      "post":
        {
          "operationId": "yooKassaWebhook",
          "security": [],
          "responses":
            {
              "200": { "$ref": "#/components/responses/Message" },
              "default": { "$ref": "#/components/responses/Error" },
            },
          "description": "Server-to-server only, rejects Cookie and Origin. Event is a hint: authenticated GET verifies test, recipient, currency, amount and metadata. No user endpoint bypasses CSRF.",
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["type", "event", "object"],
                          "properties":
                            {
                              "type":
                                { "type": "string", "const": "notification" },
                              "event": { "type": "string" },
                              "object":
                                {
                                  "type": "object",
                                  "required": ["id"],
                                  "properties": { "id": { "type": "string" } },
                                },
                            },
                        },
                    },
                },
            },
        },
    }
  "/me/feed":
    "get":
      "operationId": "feed"
      "security":
        -
          "session": []
      "responses":
        "200":
          "description": "Server-authorized response, private no-store"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "required":
                  - "posts"
                  - "nextCursor"
                "properties":
                  "posts":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/FeedPost"
                  "nextCursor":
                    "type":
                      - "string"
                      - "null"
        "default":
          "$ref": "#/components/responses/Error"
      "parameters":
        -
          "name": "cursor"
          "in": "query"
          "schema":
            "type": "string"
            "maxLength": 256
  "/me/analytics":
    "get":
      "operationId": "analytics"
      "security":
        -
          "session": []
      "responses":
        "200":
          "description": "Server-authorized response, private no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Analytics"
        "default":
          "$ref": "#/components/responses/Error"
      "description": "Owner only. Inclusive UTC dates, 1–366 days. Confirmed succeeded payments by completed_at, no provider IDs or PII. Active subscriptions are a current snapshot including canceled renewals with paid access."
      "parameters":
        -
          "name": "from"
          "in": "query"
          "schema":
            "type": "string"
            "format": "date"
        -
          "name": "to"
          "in": "query"
          "schema":
            "type": "string"
            "format": "date"
  "/posts/{id}/discussion":
    "parameters":
      -
        "name": "id"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
          "pattern": "^[0-9]+$"
    "get":
      "operationId": "discussion"
      "security":
        -
          "session": []
      "responses":
        "200":
          "description": "Server-authorized response, private no-store"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "required":
                  - "summary"
                  - "comments"
                  - "nextCursor"
                "properties":
                  "summary":
                    "$ref": "#/components/schemas/InteractionSummary"
                  "comments":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/Comment"
                  "nextCursor":
                    "type":
                      - "string"
                      - "null"
        "default":
          "$ref": "#/components/responses/Error"
      "parameters":
        -
          "name": "before"
          "in": "query"
          "schema":
            "type": "string"
            "pattern": "^[0-9]+$"
  "/posts/{id}/like":
    "parameters":
      -
        "name": "id"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
          "pattern": "^[0-9]+$"
    "put":
      "operationId": "likePost"
      "security":
        -
          "session": []
          "csrf": []
      "responses":
        "200":
          "description": "Server-authorized response, private no-store"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "required":
                  - "summary"
                "properties":
                  "summary":
                    "$ref": "#/components/schemas/InteractionSummary"
        "default":
          "$ref": "#/components/responses/Error"
    "delete":
      "operationId": "unlikePost"
      "security":
        -
          "session": []
          "csrf": []
      "responses":
        "200":
          "description": "Server-authorized response, private no-store"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "required":
                  - "summary"
                "properties":
                  "summary":
                    "$ref": "#/components/schemas/InteractionSummary"
        "default":
          "$ref": "#/components/responses/Error"
  "/posts/{id}/comments":
    "parameters":
      -
        "name": "id"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
          "pattern": "^[0-9]+$"
    "post":
      "operationId": "createComment"
      "security":
        -
          "session": []
          "csrf": []
      "responses":
        "default":
          "$ref": "#/components/responses/Error"
        "201":
          "description": "Server-authorized response, private no-store"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "required":
                  - "comment"
                  - "summary"
                "properties":
                  "comment":
                    "$ref": "#/components/schemas/Comment"
                  "summary":
                    "$ref": "#/components/schemas/InteractionSummary"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "required":
                - "body"
              "properties":
                "body":
                  "type": "string"
                  "minLength": 1
                  "maxLength": 2000
              "additionalProperties": false
  "/posts/{id}/comments/{commentID}":
    "parameters":
      -
        "name": "id"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
          "pattern": "^[0-9]+$"
      -
        "name": "commentID"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
          "pattern": "^[0-9]+$"
    "delete":
      "operationId": "deleteComment"
      "security":
        -
          "session": []
          "csrf": []
      "responses":
        "200":
          "description": "Server-authorized response, private no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Message"
        "default":
          "$ref": "#/components/responses/Error"
      "description": "Owner may delete their own comment even after losing paid access; response never discloses text."
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: etheyl_session }
    csrf: { type: apiKey, in: header, name: X-CSRF-Token }
  parameters:
    PostID: {in: path, name: id, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
    MediaID: {in: path, name: mediaID, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
    PostOffset: {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
  requestBodies:
    Post:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PostInput'}
  schemas:
    "InteractionSummary":
      "type": "object"
      "required":
        - "likeCount"
        - "liked"
        - "commentCount"
      "properties":
        "likeCount":
          "type": "integer"
        "liked":
          "type": "boolean"
        "commentCount":
          "type": "integer"
    "Comment":
      "type": "object"
      "required":
        - "id"
        - "postId"
        - "nickname"
        - "body"
        - "createdAt"
        - "own"
      "properties":
        "id":
          "type": "string"
        "postId":
          "type": "string"
        "nickname":
          "type": "string"
        "body":
          "type": "string"
        "createdAt":
          "type": "string"
          "format": "date-time"
        "own":
          "type": "boolean"
    "FeedPost":
      "allOf":
        -
          "$ref": "#/components/schemas/PostSummary"
        -
          "type": "object"
          "required":
            - "authorName"
            - "canRead"
          "properties":
            "authorName":
              "type": "string"
            "canRead":
              "type": "boolean"
    "AnalyticsDay":
      "type": "object"
      "required":
        - "date"
        - "paymentCount"
        - "amountKopecks"
      "properties":
        "date":
          "type": "string"
          "format": "date"
        "paymentCount":
          "type": "integer"
        "amountKopecks":
          "type": "integer"
    "AnalyticsTier":
      "type": "object"
      "required":
        - "id"
        - "name"
        - "archived"
        - "activeSubscriptions"
      "properties":
        "id":
          "type": "string"
        "name":
          "type": "string"
        "archived":
          "type": "boolean"
        "activeSubscriptions":
          "type": "integer"
    "Analytics":
      "type": "object"
      "required":
        - "from"
        - "to"
        - "timezone"
        - "currency"
        - "test"
        - "paymentCount"
        - "amountKopecks"
        - "activeSubscriptions"
        - "daily"
        - "tiers"
        - "asOf"
      "properties":
        "from":
          "type": "string"
          "format": "date"
        "to":
          "type": "string"
          "format": "date"
        "timezone":
          "type": "string"
          "const": "UTC"
        "currency":
          "type": "string"
          "const": "RUB"
        "test":
          "type": "boolean"
          "const": true
        "paymentCount":
          "type": "integer"
        "amountKopecks":
          "type": "integer"
        "activeSubscriptions":
          "type": "integer"
        "daily":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/AnalyticsDay"
        "tiers":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/AnalyticsTier"
        "asOf":
          "type": "string"
          "format": "date-time"
    BillingTierInput:
      {
        "type": "object",
        "required": ["tierId", "priceKopecks"],
        "properties":
          {
            "tierId": { "type": "string" },
            "priceKopecks":
              { "type": "integer", "minimum": 100, "maximum": 100000000 },
          },
      }
    Payment:
      {
        "type": "object",
        "required":
          [
            "id",
            "agreementId",
            "status",
            "amountKopecks",
            "confirmationUrl",
            "renewal",
            "test",
            "createdAt",
            "periodStart",
            "periodEnd",
            "failureCode",
          ],
        "properties":
          {
            "id": { "type": "string" },
            "agreementId": { "type": "string" },
            "status":
              {
                "type": "string",
                "enum":
                  ["queued", "pending", "succeeded", "canceled", "review"],
              },
            "amountKopecks": { "type": "integer" },
            "confirmationUrl": { "type": "string" },
            "renewal": { "type": "boolean" },
            "test": { "type": "boolean", "const": true },
            "createdAt": { "type": "string", "format": "date-time" },
            "periodStart":
              { "type": ["string", "null"], "format": "date-time" },
            "periodEnd": { "type": ["string", "null"], "format": "date-time" },
            "failureCode": { "type": "string" },
          },
      }
    PaymentHistory:
      {
        "type": "object",
        "required":
          [
            "id",
            "agreementId",
            "status",
            "amountKopecks",
            "renewal",
            "test",
            "createdAt",
            "periodStart",
            "periodEnd",
            "failureCode",
            "nickname",
            "displayName",
            "tierName",
          ],
        "properties":
          {
            "id": { "type": "string" },
            "agreementId": { "type": "string" },
            "status":
              {
                "type": "string",
                "enum":
                  ["queued", "pending", "succeeded", "canceled", "review"],
              },
            "amountKopecks": { "type": "integer" },
            "renewal": { "type": "boolean" },
            "test": { "type": "boolean", "const": true },
            "createdAt": { "type": "string", "format": "date-time" },
            "periodStart":
              { "type": ["string", "null"], "format": "date-time" },
            "periodEnd": { "type": ["string", "null"], "format": "date-time" },
            "failureCode": { "type": "string" },
            "nickname": { "type": "string" },
            "displayName": { "type": "string" },
            "tierName": { "type": "string" },
          },
      }
    Subscription:
      {
        "type": "object",
        "required":
          [
            "id",
            "authorId",
            "nickname",
            "displayName",
            "tierId",
            "tierName",
            "priceKopecks",
            "autoRenew",
            "paidUntil",
            "nextTierId",
            "nextPriceKopecks",
            "nextTierName",
            "stoppedReason",
            "active",
          ],
        "properties":
          {
            "id": { "type": "string" },
            "authorId": { "type": "string" },
            "nickname": { "type": "string" },
            "displayName": { "type": "string" },
            "tierId": { "type": "string" },
            "tierName": { "type": "string" },
            "priceKopecks": { "type": "integer" },
            "autoRenew": { "type": "boolean" },
            "paidUntil": { "type": ["string", "null"], "format": "date-time" },
            "nextTierId": { "type": ["string", "null"] },
            "nextPriceKopecks": { "type": ["integer", "null"] },
            "nextTierName": { "type": "string" },
            "stoppedReason": { "type": "string" },
            "active": { "type": "boolean" },
          },
      }
    PostInput:
      type: object
      additionalProperties: false
      required: [title, teaser, bodyMarkdown, minimumTierId]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        teaser: {type: string, maxLength: 2000, description: Explicit public plain text, independent of private body}
        bodyMarkdown: {type: string, maxLength: 100000, description: CommonMark without arbitrary HTML or dangerous link schemes}
        minimumTierId: {type: [string, 'null'], pattern: '^[1-9][0-9]*$', description: Null for public posts}
    PostSummary:
      type: object
      required: [id, authorNickname, title, teaser, minimumTierId, publishedAt]
      properties:
        id: {type: string}
        authorNickname: {type: string}
        title: {type: string}
        teaser: {type: string}
        minimumTierId: {type: [string, 'null']}
        publishedAt: {type: [string, 'null'], format: date-time}
    Post:
      allOf:
        - {$ref: '#/components/schemas/PostSummary'}
        - type: object
          required: [canRead]
          properties:
            canRead: {type: boolean}
            bodyMarkdown: {type: string, description: Only present with access}
            bodyHtml: {type: string, description: Safe server-rendered Markdown, only present with access}
            media: {type: array, items: {$ref: '#/components/schemas/PostFile'}, description: Only present with access}
    PostFile:
      type: object
      required: [id, kind, filename, contentType, sizeBytes, url, thumbnailUrl]
      properties:
        id: {type: string}
        kind: {type: string, enum: [image, audio, video, attachment]}
        filename: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer, minimum: 1, maximum: 104857600}
        url: {type: string, description: Same-origin API route, authorizes every request}
        thumbnailUrl: {type: [string, 'null']}
    ProfileInput:
      type: object
      additionalProperties: false
      required: [nickname, displayName, description]
      properties:
        nickname: {type: string, minLength: 3, maxLength: 30, pattern: '^[A-Za-z0-9_-]+$'}
        displayName: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 5000}
    Profile:
      type: object
      required: [id, nickname, displayName, description, avatar, cover]
      properties:
        id: {type: string}
        nickname: {type: string}
        displayName: {type: string}
        description: {type: string}
        avatar:
          oneOf:
            - {$ref: '#/components/schemas/ImageMetadata'}
            - {type: 'null'}
        cover:
          oneOf:
            - {$ref: '#/components/schemas/ImageMetadata'}
            - {type: 'null'}
    ImageMetadata:
      type: object
      required: [url, contentType, sizeBytes, width, height]
      properties:
        url: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer}
        width: {type: integer}
        height: {type: integer}
    TierInput:
      type: object
      additionalProperties: false
      required: [name, description, priceKopecks]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 5000}
        priceKopecks: {type: integer, minimum: 0, maximum: 100000000, description: 'Price in kopecks, RUB'}
    Tier:
      type: object
      required: [id, name, description, priceKopecks, position, used, archived]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        priceKopecks: {type: integer}
        position: {type: integer}
        used: {type: boolean}
        archived: {type: boolean}
    User:
      type: object
      required: [id, email, nickname, emailVerified, isAdmin]
      properties:
        id: { type: string, pattern: '^[0-9]+$' }
        email: { type: string, format: email }
        nickname: { $ref: '#/components/schemas/Nickname' }
        emailVerified: { type: boolean }
        isAdmin: { type: boolean }
    Email:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    Password:
      type: string
      minLength: 12
      maxLength: 256
      description: At least 12 Unicode characters, at most 256 UTF-8 bytes; no trimming or normalization.
    Nickname:
      type: string
      minLength: 3
      maxLength: 30
      pattern: '^[A-Za-z0-9_-]{3,30}$'
      description: Unique case-insensitive profile URL identifier. ASCII letters, digits, underscore and hyphen only; dots/spaces/Unicode rejected. Stored and returned in lowercase.
    Token:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 43, maxLength: 43 }
    Register:
      type: object
      additionalProperties: false
      required: [nickname, email, password]
      properties:
        nickname: { $ref: '#/components/schemas/Nickname' }
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Payment:
      {
        "description": "Test shop only; authoritative server verification",
        "content":
          {
            "application/json":
              {
                "schema":
                  {
                    "type": "object",
                    "required": ["payment"],
                    "properties":
                      { "payment": { "$ref": "#/components/schemas/Payment" } },
                  },
              },
          },
      }
    Post:
      description: Post with server-enforced content access
      content:
        application/json:
          schema:
            type: object
            required: [post]
            properties:
              post: {$ref: '#/components/schemas/Post'}
    Posts:
      description: Up to 24 summaries, newest ID first
      content:
        application/json:
          schema:
            type: object
            required: [posts, hasMore]
            properties:
              posts: {type: array, items: {$ref: '#/components/schemas/PostSummary'}}
              hasMore: {type: boolean}
    MediaBytes:
      description: Authorized original or thumbnail, no-store
      headers:
        Accept-Ranges: {schema: {type: string}}
        Content-Range: {schema: {type: string}}
        Content-Length: {schema: {type: integer}}
        Content-Disposition: {schema: {type: string}}
        Cache-Control: {schema: {type: string, const: no-store}}
        Vary: {schema: {type: string, const: Cookie}}
      content:
        '*/*':
          schema: {type: string, format: binary}
    Profile:
      description: Saved public profile
      content:
        application/json:
          schema:
            type: object
            required: [profile]
            properties:
              profile: {$ref: '#/components/schemas/Profile'}
    Tier:
      description: Saved tier
      content:
        application/json:
          schema:
            type: object
            required: [tier]
            properties:
              tier: {$ref: '#/components/schemas/Tier'}
    Tiers:
      description: Own tiers including archive, highest first
      content:
        application/json:
          schema:
            type: object
            required: [tiers]
            properties:
              tiers: {type: array, items: {$ref: '#/components/schemas/Tier'}}
    Message:
      description: Success; password recovery and resend return the same response for existing and missing accounts
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Status:
      description: Service ready
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, const: ok }
    Error:
      description: '400 invalid/expired token, 401 credentials, 403 CSRF/unverified/forbidden, 409 email/nickname already registered, 415 content type, 422 validation/unchanged password, 429 rate limit, 500 internal, 503 busy/unavailable'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
