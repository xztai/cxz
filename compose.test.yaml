# Dedicated test database; never points integration tests at application data.
services:
  test-minio:
    image: etheyl-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: etheyl_test
      MINIO_ROOT_PASSWORD: etheyl_test_password
      MINIO_BROWSER: 'off'
    ports: ['127.0.0.1:9002:9000']
    tmpfs: ['/data:uid=10001,gid=10001,mode=0700']
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 30
  test-postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: etheyl_test
      POSTGRES_PASSWORD: etheyl_test
      POSTGRES_DB: etheyl_test
      TZ: UTC
    ports: ['127.0.0.1:5433:5432']
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U etheyl_test -d etheyl_test']
      interval: 2s
      timeout: 3s
      retries: 30
