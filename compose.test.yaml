# Dedicated test database; never points integration tests at application data.
services:
  test-rustfs:
    build:
      context: .
      dockerfile: infra/rustfs.Dockerfile
    environment:
      RUSTFS_ACCESS_KEY: etheyl_test
      RUSTFS_SECRET_KEY: etheyl_test_password
      RUSTFS_CONSOLE_ENABLE: 'false'
    ports: ['127.0.0.1:${TEST_S3_PORT:-9002}:9000']
    tmpfs: ['/data:uid=10001,gid=10001,mode=0700']
    healthcheck:
      test: [CMD, rustfs-healthcheck, http://127.0.0.1:9000/health/ready]
      interval: 2s
      timeout: 3s
      retries: 30
  test-postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: etheyl_test
      POSTGRES_PASSWORD: etheyl_test
      POSTGRES_DB: etheyl_test
      TZ: UTC
    ports: ['127.0.0.1:5433:5432']
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U etheyl_test -d etheyl_test']
      interval: 2s
      timeout: 3s
      retries: 30
