name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
        env:
          POSTGRES_USER: etheyl_test
          POSTGRES_PASSWORD: etheyl_test
          POSTGRES_DB: etheyl_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U etheyl_test -d etheyl_test' --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://etheyl_test:etheyl_test@localhost:5432/etheyl_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated SQL is current
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/store
      - name: Go tests and race detector with PostgreSQL
        run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: backend/coverage.out
          retention-days: 14
      - name: PostgreSQL restore drill
        env:
          RESTORE_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 ../scripts/restore-drill.py
      - name: golangci-lint v2.15.0
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - name: Generated API types are current
        run: |
          pnpm generate:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: pnpm test:unit
      - run: pnpm check
      - run: pnpm build
  compose-e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
      - run: npm install --global pnpm@12.18.0
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: make init
      - name: Clean Compose startup and migrations
        run: docker compose up --build --wait --wait-timeout 180
      - name: Runtime database permissions
        run: docker compose exec -T postgres psql -U etheyl -d etheyl < scripts/check-db-roles.sql
      - run: make e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
      - if: always()
        run: docker compose down
