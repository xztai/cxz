name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
      - name: Install pnpm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" pnpm@12.18.0
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: mkdir -p security-results
      - name: Go vulnerability analysis
        working-directory: backend
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$RUNNER_TEMP/govulncheck" -scan=symbol -json ./... > ../security-results/govulncheck.json
          test -s ../security-results/govulncheck.json
          "$RUNNER_TEMP/govulncheck" -mode=convert -format=text < ../security-results/govulncheck.json
      - name: npm advisory audit
        if: '!cancelled()'
        run: pnpm --dir frontend audit --prod --audit-level high --json > security-results/npm-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # act's artifact server currently rejects upload-artifact v7.
        if: ${{ !cancelled() && !env.ACT }}
        with:
          name: dependency-security
          path: security-results
          retention-days: 30
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 scripts/install-security-tools.py /tmp/security-tools
      - name: Scan full Git history and current source
        run: |
          /tmp/security-tools/gitleaks git . --redact --log-opts='--all'
          python3 scripts/scan-secrets.py /tmp/security-tools/gitleaks
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
          - name: rustfs
    env:
      SCAN_IMAGE: etheyl-security:${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/install-security-tools.py /tmp/security-tools
      - name: Build final image
        env:
          DOCKERFILE: ${{ matrix.dockerfile || 'infra/rustfs.Dockerfile' }}
        run: docker build --file "$DOCKERFILE" --tag "$SCAN_IMAGE" .
      - name: Scan image and retain package inventory
        run: |
          mkdir -p security-results
          /tmp/security-tools/grype "docker:$SCAN_IMAGE" --fail-on high \
            --output table --output json=security-results/grype.json \
            --output cyclonedx-json=security-results/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && !env.ACT }}
        with:
          name: image-security-${{ matrix.name }}
          path: security-results
          retention-days: 30
